<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbit Connect — Logic Chess</title>

  <!-- Mobile-friendly viewport -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Orbit Connect</h1>

      <!-- Tabs -->
      <nav class="tabs" role="tablist" aria-label="Primary">
        <button id="tabSettings" class="tab" role="tab" aria-selected="true" aria-controls="panelSettings">Settings</button>
        <button id="tabGame" class="tab" role="tab" aria-selected="false" aria-controls="panelGame">Game</button>
      </nav>
    </header>

    <!-- SETTINGS (only grid size now) -->
    <section id="panelSettings" class="panel" role="tabpanel" aria-labelledby="tabSettings">
      <h2>Game Settings</h2>

      <fieldset class="field">
        <legend>Grid Size</legend>
        <label class="radio"><input type="radio" name="gridSize" value="4" checked> 4 × 4</label>
        <label class="radio"><input type="radio" name="gridSize" value="6"> 6 × 6</label>
      </fieldset>

      <div class="actions">
        <button id="startGame" class="btn btn-primary">Start Game</button>
      </div>

      <p class="small muted">Changing size resets the game.</p>
    </section>

    <!-- GAME -->
    <section id="panelGame" class="panel hidden" role="tabpanel" aria-labelledby="tabGame">
      <section class="hud">
        <!-- Minimal status: only show the winner text; otherwise empty -->
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="controls">
          <button id="undo" class="btn btn-secondary">Undo</button>
          <button id="newGame" class="btn btn-primary">New Game</button>
        </div>
      </section>

      <!-- Outer frame glows (blue/red) to indicate whose turn -->
      <section id="boardFrame" class="board-frame">
        <section id="board" class="board" aria-label="Game board"></section>
      </section>
    </section>
  </main>

  <!-- JS -->
  <script src="./app.js"></script>
</body>
</html>
